name: clean_arch_demo
description: Demo Clean Architecture (Presentation / Domain / Data) + DI với get_it & injectable trên Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  injectable: ^2.4.4
  dio: ^5.4.3
  dartz: ^0.10.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.6.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
